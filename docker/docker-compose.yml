name: nfl-tipping-game

services:
  db:
    container_name: nfl-tipping-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nfl
      POSTGRES_PASSWORD: nflsecret
      POSTGRES_DB: nfl_tipping
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfl -d nfl_tipping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: nfl-tipping-api
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://nfl:nflsecret@db:5432/nfl_tipping?schema=public
      # Same-origin via nginx; allow LAN access without CORS friction
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    # API is reached via docker network from nginx — no host port needed
    depends_on:
      db:
        condition: service_healthy

  web:
    container_name: nfl-tipping-web
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_URL: ""
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
